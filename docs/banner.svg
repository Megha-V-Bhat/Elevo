  <text x="290" y="200" font-family="'Bricolage Grotesque','Segoe UI',system-ui,sans-serif" font-size="104" font-weight="800" fill="#0B3B36" letter-spacing="-3">Elevo</text>
  <text x="294" y="252" font-family="'Manrope','Segoe UI',system-ui,sans-serif" font-size="32" font-weight="600" fill="#0B5D56">Mentoring that grows with you.</text>
  <text x="294" y="300" font-family="'Manrope','Segoe UI',system-ui,sans-serif" font-size="20" fill="#3F5F5A">Academic mentoring for college departments · Students · Mentors · HOD</text>
