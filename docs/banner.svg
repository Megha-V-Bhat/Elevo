  <!-- mark -->
  <g transform="translate(96 108) scale(2.6)">
    <path d="M32 60 C32 50 32 42 32 31" fill="none" stroke="#0F766E" stroke-width="5" stroke-linecap="round"/>
    <path d="M31 43 C17 44 7 34 7 18 C22 18 31 28 31 43 Z" fill="url(#leaf)"/>
    <path d="M33 33 C33 22 41 13 56 13 C56 26 47 34 33 33 Z" fill="#34D399"/>
