<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Elevo — Mentoring that grows with you">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3FBF7"/>
      <stop offset="1" stop-color="#E6F6EF"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <circle cx="1130" cy="70" r="150" fill="#EDE9FE" opacity=".7"/>
  <circle cx="1210" cy="360" r="120" fill="#FEF3C7" opacity=".8"/>
  <circle cx="980" cy="330" r="70" fill="#D1FAE5"/>
  <!-- growth rings -->
  <g fill="none" stroke="#0F766E" stroke-linecap="round" transform="translate(1040 210)">
